<style id="workeaser-brand-normalize">
:root {
  --wk-cyan: #00A2DD;
  --wk-cyan-d: #0089BE;
  --wk-cyan-l: #CBEBFA;
  --wk-navy: #2B3450;
  --wk-navy-d: #1C2436;
  --wk-border: #E3E8EE;
  --wk-bg: #FFFFFF;
  --wk-surf: #F7F9FC;
  --wk-muted: #6B7280;
  --sidebar-width: 240px;
  --gutter: 24px;
  --margin-page: 32px;
}
/* layout utilities Stitch references but does not define */
.ml-sidebar-width { margin-left: var(--sidebar-width); }
.w-sidebar-width  { width: var(--sidebar-width); }
.px-gutter { padding-left: var(--gutter); padding-right: var(--gutter); }
.gap-gutter { gap: var(--gutter); }
.mt-gutter { margin-top: var(--gutter); }
.p-margin-page { padding: var(--margin-page); }

/* brand token remap — override Stitch's Material palette with Workeaser brand */
.bg-primary { background-color: var(--wk-cyan) !important; }
.bg-primary:hover, .hover\:bg-primary-container:hover { background-color: var(--wk-cyan-d) !important; }
.bg-primary-container, .bg-primary-fixed { background-color: var(--wk-cyan-l) !important; }
.text-primary { color: var(--wk-cyan) !important; }
.text-on-primary { color: #ffffff !important; }
.text-on-primary-container { color: var(--wk-navy) !important; }
.border-primary, .border-primary-container { border-color: var(--wk-cyan) !important; }
.text-outline { color: var(--wk-muted) !important; }
.border-border-light { border-color: var(--wk-border) !important; }
.bg-bg-main { background-color: var(--wk-bg) !important; }
.bg-surface { background-color: var(--wk-surf) !important; }
.bg-surface-container-lowest, .bg-surface-container-low, .bg-surface-container,
.bg-surface-bright, .bg-surface-dim { background-color: var(--wk-surf) !important; }
.bg-surface-container-high, .bg-surface-container-highest { background-color: #EEF2F7 !important; }
.bg-surface-variant { background-color: #EEF2F7 !important; }
.text-on-surface { color: var(--wk-navy) !important; }
.text-on-surface-variant { color: var(--wk-muted) !important; }
.text-secondary { color: var(--wk-muted) !important; }
/* navy table headers */
.font-table-header, thead, .bg-navy { }
/* headings in navy */
.font-display-lg, .font-headline-md, .font-headline-sm, h1, h2, h3 { color: var(--wk-navy); }
</style>

</head>
<body class="bg-surface font-body-md text-body-md text-on-surface antialiased min-h-screen flex flex-col">
<!-- TopNavBar Header Shell -->
<header class="bg-surface dark:bg-surface-dim font-body-md text-body-md w-full h-16 border-b border-border-light dark:border-outline">

<div class="font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim">

            </div>
<div class="flex items-center gap-4">
<button aria-label="Notifications" class="text-on-secondary-container hover:text-primary transition-colors flex items-center justify-center p-2 rounded-full hover:bg-surface-container-high">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<button aria-label="Chat" class="text-on-secondary-container hover:text-primary transition-colors flex items-center justify-center p-2 rounded-full hover:bg-surface-container-high">
<span class="material-symbols-outlined" data-icon="chat">chat</span>
</button>
<button class="w-8 h-8 rounded-full overflow-hidden border border-border-light ml-2 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">

</button>
</div>
</div>
</header>
<!-- Main Content Area -->

<div class="flex flex-wrap items-center gap-4 w-full md:w-auto">
<!-- Chip 1 -->

<button class="bg-primary text-on-primary font-body-sm text-body-sm px-4 py-1.5 rounded-full hover:bg-on-primary-container transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                        Pay

</div>
<!-- Chip 2 -->
<div class="flex items-center bg-bg-main border border-border-light rounded-full pl-4 pr-1 py-1 gap-3 w-full md:w-auto justify-between md:justify-start">
<span class="text-on-surface font-body-sm text-body-sm">1 contract to sign</span>

</div>

</button>

<!-- Chat Card -->

</div>
<div class="absolute top-6 right-6 bg-error text-on-error font-label-caps text-label-caps w-6 h-6 rounded-full flex items-center justify-center">
                    3
                </div>
<div>

</div>
</button>
<!-- Reservations Card -->
<button class="bg-bg-main border border-border-light rounded-lg p-6 flex flex-col justify-between items-start text-left hover:border-primary transition-colors group focus:outline-none focus:ring-2 focus:ring-primary">
<div class="w-12 h-12 rounded-lg bg-surface-container-low flex items-center justify-center mb-4 group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-primary" data-icon="calendar_month">calendar_month</span>
</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-1">Reservations</h3>
<p class="font-body-sm text-body-sm text-secondary">Next: Meeting Room, Fri 10am</p>
</div>
</button>
</section>
</main>
<!-- Dismissible Announcements Strip -->

<div class="max-w-7xl w-full flex justify-between items-center">
<p class="font-body-sm text-body-sm">
<strong>New Feature:</strong> You can now book recurring meeting rooms directly from the app.
            </p>
<button class="text-on-primary hover:text-surface-variant transition-colors flex items-center p-1 rounded-full focus:outline-none focus:ring-2 focus:ring-white" onclick="document.getElementById('announcement-strip').classList.add('translate-y-full')">
<span class="material-symbols-outlined" data-icon="close">close</span>
